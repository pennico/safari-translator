<head><meta charset="utf-8"><title>Opskrift på æbleskiver</title></head>
<body>
<h1>Sådan laver du de bedste æbleskiver</h1>
<p>Pisk æggeblommerne med sukker, og tilsæt derefter mel, kardemomme og kærnemælk. Lad dejen hvile en halv time, mens du
varmer panden godt op.</p>
<p>Vend skiverne med en strikkepind, så de bliver runde og gyldne på alle sider. Server dem med syltetøj og flormelis.</p>
</body>
